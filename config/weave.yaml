# Shared config. Ingestion stamps these values on Source nodes; agents filter on them.
# Changes need both builders.

tenant: acme

embedding:
  model: BAAI/bge-small-en-v1.5
  dim: 384

# Claims under this confidence are labelled "likely".
likely_threshold: 0.7
# Provisional entities (seen once by resolution) are hidden from agents.
hide_provisional: true
# A source whose last good ACL sync is older than this is excluded.
acl_stale_minutes: 15
# Tell callers how many hops or sources were hidden from them. Off: a count
# reveals that restricted sources exist. The audit log always records it.
hidden_sources_notice: false
# A figure whose as_of is older than this gets a stale badge.
figure_stale_days: 30
# Expertise (find_owner) decays with item age; an item this old counts half.
expertise_half_life_days: 30

# Answer agent (agents side only).
answer:
  # Tool calls per question, recall included.
  max_tool_calls: 6
  # A claim without an evidence id: drop it, or keep it marked unsupported.
  citation_policy: drop
  recall_limit: 5
  # Memory stores node ids and a short note, never facts.
  note_max_chars: 200
  # Read-tool results are cached per visibility hash for this long.
  cache_ttl_seconds: 60
  llm:
    # Still open (Groq or Grok). "none" runs the rule-based components.
    provider: none

# Impact watcher (agents side only): python -m agents.watcher.
watcher:
  # Change events claimed per tick; handoffs and DMs use the same limit.
  batch: 20
  # Seconds between ticks with --every and no value.
  every: 60
  # dry_run records the DM on the task. slack posts it, never for the
  # fixture tenant, and needs SLACK_BOT_TOKEN.
  send: dry_run

# Default authority by system: formal documents 3, trackers 2, chat 1.
authority:
  notion: 3
  gdrive: 3
  github: 2
  slack: 1

# Per-source policy, keyed by the source's ACL group string.
# org_wide: items carry their own group plus org:all, so everyone may read
# them while the source's own group still drives the stale-sync check.
# The first five sources are the visibility matrix on page 15 of the
# architecture doc; the rest carry the demo story.
