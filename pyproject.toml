[project]
name = "weave"
version = "0.1.0"
description = "Weave organizational memory"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.0.0",
    "fastapi>=0.143",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.100",
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]
embed = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "shared*", "fixtures*", "agents*"]
