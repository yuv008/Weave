<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 176" overflow="visible" role="img" aria-label="Wisp, classic">
  <defs>
    <radialGradient id="c-body" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="18%" stop-color="#DDD6FE"/>
      <stop offset="46%" stop-color="#8B5CF6"/>
      <stop offset="78%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </radialGradient>
    <radialGradient id="c-shade" cx="72%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-sheen" cx="32%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="c-bulb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <filter id="c-cast" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="3.5" flood-color="#0B0F1A" flood-opacity="0.28"/>
    </filter>
    <style>
      .eye { transform-box: fill-box; transform-origin: center; }
      .foot { transform-box: fill-box; transform-origin: center bottom; }
      .tail-knot { display: none; }
      .wisp[data-state="found"] .tail-loose { display: none; }
      .wisp[data-state="found"] .tail-knot { display: block; }
      .wisp[data-state="alert"] .bulb { filter: drop-shadow(0 0 7px #C4B5FD); }
      @media (prefers-reduced-motion: reduce) {
        .float, .sway, .eye, .foot { animation: none !important; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50% { transform: translateY(-7px) scale(1.015, 0.985); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-2.5deg); }
        50% { transform: rotate(2.5deg); }
      }
      @keyframes blink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }
      @keyframes step {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .float { animation: float 3.2s ease-in-out infinite; transform-origin: 70px 100px; }
      .sway { animation: sway 5.2s ease-in-out infinite; transform-origin: 70px 110px; }
      .eye { animation: blink 4.6s infinite; }
      .foot-l { animation: step 0.7s ease-in-out infinite; }
      .foot-r { animation: step 0.7s ease-in-out infinite 0.35s; }
      .wisp[data-state="reading"] .float { animation-duration: 1.35s; }
      .wisp[data-state="reading"] .sway { animation-duration: 1.15s; }
      .wisp[data-state="unsure"] .sway { transform: rotate(7deg); animation-duration: 6.5s; }
    </style>
  </defs>
  <g class="wisp" data-state="resting" data-variant="classic">
    <g class="float">
      <g class="sway">
        <ellipse cx="70" cy="158" rx="26" ry="5" fill="#0B0F1A" opacity="0.22"/>
        <g filter="url(#c-cast)">
          <path class="tail-loose" fill="url(#c-ribbon)" d="M104 108c14 6 24 20 18 34-4 10-16 12-20 4-6-12-2-22-10-28-6-4-4-12 12-10z"/>
          <path class="tail-loose" fill="#fff" opacity="0.28" d="M108 114c8 4 14 12 10 20-6-2-8-10-14-14 1-3 2-5 4-6z"/>
          <path class="tail-knot" fill="url(#c-ribbon)" d="M102 104c16 2 22 16 12 24-6 5-8 2-6-2 4 8-6 16-14 10-4-3-2-8 2-8-8 2-14-6-10-14 3-6 10-12 16-10z"/>
          <path fill="url(#c-body)" d="M70 34c-34 2-50 28-46 58-4 32 18 52 46 50 30 2 52-18 48-52 4-30-14-58-48-56z"/>
          <path fill="url(#c-shade)" d="M70 34c-34 2-50 28-46 58-4 32 18 52 46 50 30 2 52-18 48-52 4-30-14-58-48-56z"/>
          <ellipse cx="52" cy="62" rx="22" ry="26" fill="url(#c-sheen)"/>
          <path fill="none" stroke="#F8FAFC" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round" d="M40 58c6-16 22-24 36-18"/>
          <g class="eye">
            <ellipse cx="52" cy="78" rx="6.2" ry="7.6" fill="#0B0F1A"/>
            <ellipse cx="50.4" cy="75.2" rx="2.1" ry="2.5" fill="#F8FAFC"/>
            <ellipse cx="54.2" cy="81.4" rx="1" ry="1.1" fill="#F8FAFC" opacity="0.45"/>
          </g>
          <g class="eye" style="animation-delay:.08s">
            <ellipse cx="86" cy="78" rx="6.2" ry="7.6" fill="#0B0F1A"/>
            <ellipse cx="84.4" cy="75.2" rx="2.1" ry="2.5" fill="#F8FAFC"/>
            <ellipse cx="88.2" cy="81.4" rx="1" ry="1.1" fill="#F8FAFC" opacity="0.45"/>
          </g>
          <path class="foot foot-l" fill="#2563EB" d="M42 128c-6 2-8 10-4 16 3 4 8 4 12 1 3-8 2-14-8-17z"/>
          <path class="foot foot-r" fill="#1D4ED8" d="M86 128c6 2 10 10 6 16-3 4-8 4-12 1-4-8-3-14 6-17z"/>
          <path fill="#C4B5FD" d="M70 36c-1-14 1-22 2-28 2 6 4 16 2 28-1-1-2-1-4 0z"/>
          <circle class="bulb" cx="72" cy="8" r="7.5" fill="url(#c-bulb)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
