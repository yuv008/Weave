<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Weave</title>
<link rel="icon" href="/brand/icon.png">
<link rel="stylesheet" href="/landing/stage.css">
<style>
  form { display: grid; gap: 12px; max-width: 360px; margin-top: 28px; }
  label { color: var(--dim); font-size: 14px; }
  input {
    height: 44px; border-radius: 6px; border: 1px solid var(--line);
    background: #0a0a0a; color: var(--ink); padding: 0 12px; font: inherit;
  }
  button {
    height: 44px; border: 0; border-radius: 6px; background: #fff; color: #000;
    font-weight: 650; cursor: pointer;
  }
  button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .error { color: #f5f5f5; min-height: 1.4em; }
  .alt { color: var(--dim); }
  .alt a { color: var(--ink); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/brand/mark.png" alt="">Weave</a>
  <nav class="nav">
    <a class="textlink" href="/guide">Pet guide</a>
    <a class="textlink" href="/signup">Create a company</a>
  </nav>
</header>
<main class="hero">
  <h1>Forgot your password?</h1>
  <p class="lede">Enter your account email. If it has a Weave account, a reset link arrives in a minute.</p>
  <p id="note" class="error" role="status"></p>
  <form method="post" action="/forgot">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <button type="submit">Send reset link</button>
  </form>
  <p class="alt"><a href="/login">Back to sign in</a></p>
</main>
<script>
if (new URLSearchParams(location.search).get("sent")) {
  document.getElementById("note").textContent = "If that address has an account, a reset link is on its way. It works once, for 30 minutes.";
}
</script>
</body>
</html>
