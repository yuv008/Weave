<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave</title>
<style>
  :root {
    --bg: #0B0F1A;
    --card: #12182A;
    --line: rgba(248, 250, 252, 0.12);
    --text: #F8FAFC;
    --muted: #A8B3C7;
    --purple: #7C3AED;
    --blue: #3B82F6;
    --good: #86EFAC;
    --warn: #FCD34D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  p { color: var(--muted); }
  .mark {
    width: 36px; height: 36px; border-radius: 10px; margin-bottom: 16px;
    background: linear-gradient(120deg, var(--purple), var(--blue));
  }
  form, .card, .result {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
  }
  label { display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
  }
  button, .button {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 14px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(100deg, var(--purple), var(--blue));
    color: white;
    text-decoration: none;
    cursor: pointer;
  }
  button[disabled], .button[aria-disabled="true"] {
    background: #2A3148;
    color: var(--muted);
    cursor: not-allowed;
    pointer-events: none;
  }
  .card { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  .status { font-size: 0.9rem; color: var(--muted); }
  .status.connected, .status.syncing { color: var(--good); }
  .status.failed { color: var(--warn); }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #0B0F1A;
    padding: 12px;
    border-radius: 8px;
  }
  .error { color: var(--warn); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Set up Weave</h1>
  <p>Connect the tools your company already uses. One connection is enough to start. Weave does not show excerpts on this page.</p>

  <h2>1. Company</h2>
  <form id="company">
    <label for="company-name">Company name</label>
    <input id="company-name" name="name" maxlength="80" required>
    <button type="submit">Save</button>
  </form>

  <h2>2. Connect</h2>
  <div id="cards">
    <div class="card" data-provider="slack" data-connectable="false"></div>
    <div class="card" data-provider="notion" data-connectable="false"></div>
    <div class="card" data-provider="google" data-connectable="false"></div>
    <div class="card" data-provider="github" data-connectable="false"></div>
    <div class="card" data-provider="hubspot" data-connectable="false"></div>
  </div>

  <h2>3. Open Weave</h2>
  <form id="model">
    <label for="model-key">Model key, optional</label>
    <input id="model-key" name="key" type="password" autocomplete="off" placeholder="Leave empty to use the server default">
    <button type="submit">Save key</button>
    <p id="model-state" class="status"></p>
  </form>
  <button id="open" type="button">Open Weave</button>
  <p id="open-error" class="error"></p>
  <div id="result" class="result" hidden>
    <p>Copy this token into the pet config or Cursor. It is shown once.</p>
    <pre id="token"></pre>
    <p>Cursor MCP</p>
    <pre id="mcp"></pre>
    <button id="download" type="button">Download pet config</button>
  </div>
</main>
<script>
const cards = document.getElementById("cards");
const params = new URLSearchParams(location.search);

function cardView(card) {
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.dataset.provider = card.id;
  wrap.dataset.connectable = card.connectable ? "true" : "false";
  const text = document.createElement("div");
  const title = document.createElement("strong");
  title.textContent = card.name;
  const state = document.createElement("div");
  state.className = "status " + card.status;
  state.textContent = card.reason || card.status;
  text.append(title, state);
  wrap.append(text);
  if (card.connectable) {
    const link = document.createElement("a");
    link.className = "button";
    link.href = "/connect/" + card.id;
    link.textContent = "Connect";
    wrap.append(link);
  } else {
    const link = document.createElement("span");
    link.className = "button";
    link.setAttribute("aria-disabled", "true");
    link.textContent = card.status === "disconnected" ? "Connect" : card.status;
    wrap.append(link);
  }
  cards.append(wrap);
  if (card.needs && card.needs.includes("folder")) folderForm(wrap);
  if (card.needs && card.needs.includes("repo")) repoForm(wrap);
}

function folderForm() {
  const form = document.createElement("form");
  form.id = "folder";
  form.innerHTML = '<label for="folder-id">Drive folder id</label><input id="folder-id" required><button type="submit">Save folder</button>';
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    await post("/setup/google/folder", { folder_id: form.querySelector("input").value });
    load();
  });
  cards.append(form);
}

function repoForm() {
  const form = document.createElement("form");
  form.id = "repo";
  form.innerHTML = '<label for="repo-owner">GitHub owner</label><input id="repo-owner" required><label for="repo-name">Repository</label><input id="repo-name" required><button type="submit">Save repository</button>';
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    await post("/setup/github/repo", {
      owner: document.getElementById("repo-owner").value,
      repo: document.getElementById("repo-name").value,
    });
    load();
  });
  cards.append(form);
}

async function post(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || "request failed");
  return payload;
}

async function load() {
  const status = await fetch("/setup/status").then((response) => response.json());
  document.getElementById("company-name").value = status.company || "";
  document.getElementById("model-state").textContent = status.model === "saved" ? "A model key is saved." : "Using the server default.";
  cards.replaceChildren();
  (status.connectors || []).forEach(cardView);
  if (params.get("error")) {
    const note = document.createElement("p");
    note.className = "error";
    note.textContent = "That connect did not finish. Try the button again.";
    cards.prepend(note);
  }
}

document.getElementById("company").addEventListener("submit", async (event) => {
  event.preventDefault();
  await post("/setup/company", { name: document.getElementById("company-name").value });
  load();
});

document.getElementById("model").addEventListener("submit", async (event) => {
  event.preventDefault();
  const saved = await post("/setup/model", { key: document.getElementById("model-key").value });
  document.getElementById("model-key").value = "";
  document.getElementById("model-state").textContent = saved.model === "saved" ? "A model key is saved." : "Using the server default.";
});

let pet = null;
document.getElementById("open").addEventListener("click", async () => {
  const error = document.getElementById("open-error");
  error.textContent = "";
  try {
    const opened = await post("/setup/open", {});
    pet = opened.pet;
    document.getElementById("token").textContent = opened.token;
    document.getElementById("mcp").textContent = JSON.stringify(opened.mcp, null, 2);
    document.getElementById("result").hidden = false;
  } catch (exc) {
    error.textContent = exc.message;
  }
});

document.getElementById("download").addEventListener("click", () => {
  if (!pet) return;
  const blob = new Blob([JSON.stringify(pet, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "pet.config.json";
  link.click();
});

load();
</script>
</body>
</html>
