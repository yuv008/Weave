pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # The load balancer sits in the VPC. The client address is the last
    # X-Forwarded-For entry it did not add, so a sent header cannot fake it.
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per client address. Sign-in limits POST only, so the pages still load.
    map $request_method $sign_in_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $sign_in_key zone=sign_in:10m rate=10r/m;
    # Loose per address (an office shares one); the agent also limits each token.
    limit_req_zone $binary_remote_addr zone=agent:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=wisp:10m rate=300r/m;
    limit_req_status 429;

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;

        location = /login {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location = /signup {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location = /forgot {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location = /reset {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location = /verify/resend {
            limit_req zone=sign_in burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }

        location /mcp {
            limit_req zone=agent burst=40 nodelay;
            proxy_pass http://127.0.0.1:8765;
        }

        location /answer {
            limit_req zone=agent burst=40 nodelay;
            proxy_pass http://127.0.0.1:8765;
        }

        location /actions {
            limit_req zone=agent burst=40 nodelay;
            proxy_pass http://127.0.0.1:8765;
        }

        location /wisp {
            limit_req zone=wisp burst=60 nodelay;
            proxy_pass http://127.0.0.1:8765;
        }

        location /ops {
            proxy_pass http://127.0.0.1:8765;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
