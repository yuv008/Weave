<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Weave</title>
<link rel="icon" href="/brand/icon.png">
<link rel="stylesheet" href="/landing/stage.css">
<style>
  form { display: grid; gap: 12px; max-width: 360px; margin-top: 28px; }
  label { color: var(--dim); font-size: 14px; }
  input {
    height: 44px; border-radius: 6px; border: 1px solid var(--line);
    background: #0a0a0a; color: var(--ink); padding: 0 12px; font: inherit;
  }
  button {
    height: 44px; border: 0; border-radius: 6px; background: #fff; color: #000;
    font-weight: 650; cursor: pointer;
  }
  button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .error { color: #f5f5f5; min-height: 1.4em; }
  .alt { color: var(--dim); }
  .alt a { color: var(--ink); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/brand/mark.png" alt="">Weave</a>
  <a class="textlink" href="/signup">Create a company</a>
</header>
<main class="hero">
  <h1>Sign in.</h1>
  <p class="lede">Use the email for your company.</p>
  <p id="error" class="error" role="alert"></p>
  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="alt">New company? <a href="/signup">Create one</a></p>
</main>
<script>
const code = new URLSearchParams(location.search).get("error");
if (code) document.getElementById("error").textContent = "That email or password is wrong.";
</script>
</body>
</html>
