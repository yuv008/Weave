<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 176" overflow="visible" role="img" aria-label="Spark">
  <defs>
    <radialGradient id="s-body" cx="40%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="26%" stop-color="#FDBA74"/>
      <stop offset="62%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>
    <radialGradient id="s-sheen" cx="34%" cy="26%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-bulb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="s-cast" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="2.6" flood-color="#0B0F1A" flood-opacity="0.22"/>
    </filter>
    <style>
      .eye, .foot { transform-box: fill-box; transform-origin: center; }
      .foot { transform-origin: center bottom; }
      @media (prefers-reduced-motion: reduce) { .float, .sway, .eye, .foot { animation: none !important; } }
      @keyframes float { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }
      @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
      @keyframes blink { 0%,86%,100% { transform: scaleY(1); } 93% { transform: scaleY(0.08); } }
      @keyframes step { 50% { transform: translateY(-3px); } }
      .float { animation: float 2.4s ease-in-out infinite; transform-origin: 70px 100px; }
      .sway { animation: sway 3.2s ease-in-out infinite; transform-origin: 70px 110px; }
      .eye { animation: blink 3.6s infinite; }
      .foot-l { animation: step 0.55s ease-in-out infinite; }
      .foot-r { animation: step 0.55s ease-in-out infinite 0.28s; }
    </style>
  </defs>
  <g class="wisp" data-variant="spark">
    <g class="float"><g class="sway">
      <ellipse cx="68" cy="164" rx="20" ry="4.5" fill="#0B0F1A" opacity="0.16"/>
      <g filter="url(#s-cast)">
        <path fill="#BE123C" d="M96 118c14 4 20 16 12 24-7 6-16 1-18-8-1-6 0-12 6-16z"/>
        <path fill="#fff" opacity="0.28" d="M100 124c6 3 8 8 4 12-3-3-5-7-8-9 1-2 2-3 4-3z"/>
        <path fill="url(#s-body)" d="M66 40c-22 8-32 36-26 64 4 22 22 36 40 34 20-2 34-18 32-40-2-28-16-52-46-58z"/>
        <ellipse cx="54" cy="72" rx="14" ry="18" fill="url(#s-sheen)"/>
        <path fill="none" stroke="#FFF7ED" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" d="M44 68c4-12 14-16 24-8"/>
        <g class="eye">
          <ellipse cx="56" cy="96" rx="6.2" ry="7.4" fill="#4C0519"/>
          <ellipse cx="54.2" cy="93.2" rx="2.1" ry="2.5" fill="#FFF7ED"/>
          <ellipse cx="58.2" cy="99.4" rx="1" ry="1.1" fill="#FFF7ED" opacity="0.5"/>
        </g>
        <g class="eye" style="animation-delay:.05s">
          <ellipse cx="82" cy="94" rx="5.4" ry="6.4" fill="#4C0519"/>
          <ellipse cx="80.4" cy="91.6" rx="1.8" ry="2.1" fill="#FFF7ED"/>
          <ellipse cx="84" cy="97" rx="0.9" ry="1" fill="#FFF7ED" opacity="0.5"/>
        </g>
        <path class="foot foot-l" fill="#E11D48" d="M50 136c-5 2-6 8-3 12 2 3 6 3 9 0 2-5 1-10-6-12z"/>
        <path class="foot foot-r" fill="#BE123C" d="M82 132c5 1 8 7 4 11-3 3-7 2-9-1-2-5 0-9 5-10z"/>
        <path fill="#FDBA74" d="M64 42c-1-12 2-20 3-26 2 6 4 16 2 26z"/>
        <circle cx="67" cy="14" r="6" fill="url(#s-bulb)"/>
      </g>
    </g></g>
  </g>
</svg>
