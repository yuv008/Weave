# Local stores for the shared contract. Both builders run the same images.
# FalkorDB browser UI: http://localhost:3000
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  falkordb-data:
  postgres-data:
